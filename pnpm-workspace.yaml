packages:
  - apps/*
  - packages/*
  - tools/oxlint/anti-slop

catalog:
  '@convex-dev/migrations': ^0.3.6
  '@convex-dev/react-query': 0.1.0
  '@edge-runtime/vm': ^3.2.0
  '@effect/vitest': 4.0.0-beta.43
  '@lingui/babel-plugin-lingui-macro': 6.6.0
  '@lingui/cli': 6.6.0
  '@lingui/conf': 6.6.0
  '@lingui/core': 6.6.0
  '@lingui/react': 6.6.0
  '@lingui/vite-plugin': 6.6.0
  '@oxlint/plugins': 1.78.0
  '@t3-oss/env-core': 0.13.11
  '@tailwindcss/vite': ^4.2.2
  '@tanstack/react-query': ^5.90.17
  '@tanstack/react-router': ^1.141.1
  '@tanstack/router-plugin': ^1.141.1
  '@types/node': ^22.13.13
  # react/react-dom are exact and shared by web and native: Expo SDK 56 bundles
  # React 19.2.3, so one React runtime serves the whole workspace.
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3
  '@vitejs/plugin-react': ^4.3.4
  convex: ^1.43.0
  convex-helpers: ^0.1.122
  convex-logto: ^0.7.4
  convex-test: 0.0.55
  effect: 4.0.0-beta.43
  eslint-plugin-better-tailwindcss: ^4.4.1
  npm-run-all2: ^8.0.4
  oxfmt: ^0.45.0
  oxlint: 1.78.0
  oxlint-tsgolint: 7.0.2001
  react: 19.2.3
  react-dom: 19.2.3
  tailwindcss: ^4.2.2
  typescript: ^5
  vite: ^6.4.1
  vitest: ^4.0.18
  zod: ^4.1.13

# Keep all workspace settings here, not in .npmrc: pnpm 11 stops reading
# non-auth settings from .npmrc.
nodeLinker: hoisted

# Declares convex-test as an optional peer so the `./test` subpath of this
# upstream package resolves under strict pnpm.
packageExtensions:
  '@convex-dev/migrations':
    peerDependencies:
      convex-test: '*'
    peerDependenciesMeta:
      convex-test:
        optional: true

# Expo SDK 56 pins these native modules. Without the override, optional-peer
# resolution in packages that never render UI picks the newest release, which
# needs a newer react-native.
overrides:
  react-native-reanimated: 4.3.1
  react-native-worklets: 0.8.3

# Fail any `pnpm run` against a node_modules that is out of sync with the
# lockfile instead of surfacing as cross-package type errors.
verifyDepsBeforeRun: error
